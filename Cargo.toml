[package]
name = "simcraft"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "FEA simulation app (structural, thermal, modal, thermal-stress) with a simple UI and an MCP server"
repository = "https://github.com/sushil-sundaram/simcraft"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
bytemuck = { version = "1.25.2", features = ["derive"] }
eframe = { version = "0.37.0", default-features = false, features = ["glow", "wayland", "x11", "default_fonts", "system_fonts", "clipboard", "accesskit"] }
png = "0.18.1"
pollster = "1.0.3"
rayon = "1.12.0"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.5.2", features = ["json"] }
wgpu = "30.0.2"
