[package]
name = "simcraft"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "FEA simulation app (structural, thermal, modal, thermal-stress) with a simple UI and an MCP server"
repository = "https://github.com/sushil-sundaram/simcraft"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
bytemuck = { version = "1.25.2", features = ["derive"] }
eframe = { version = "0.37.0", default-features = false, features = ["glow", "wayland", "x11", "default_fonts", "system_fonts", "clipboard", "accesskit"] }
getrandom = "0.4.3"
png = "0.18.1"
pollster = "1.0.3"
rayon = "1.12.0"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
ureq = { version = "3.5.2", features = ["json"] }
wgpu = "30.0.2"
monstertruck-assembly = "0.4.3"
monstertruck-core = "0.4.3"
monstertruck-geometry = "0.4.3"
monstertruck-io = { version = "0.4.3", default-features = false, features = ["step"] }
monstertruck-meshing = { version = "0.4.3", default-features = false, features = ["tessellation"] }
monstertruck-topology = "0.4.3"
step-p21 = "0.1"

[dev-dependencies]
monstertruck-modeling = "0.4.3"

# Deliberate patterns in the numerical kernels: loops index several arrays in lock-step,
# `!(x > 0.0)` rejects NaN on purpose, solver entry points take many arguments and some return
# tuples of vectors. Everything else clippy reports is fixed.
[lints.clippy]
needless_range_loop = "allow"
neg_cmp_op_on_partial_ord = "allow"
type_complexity = "allow"
too_many_arguments = "allow"
