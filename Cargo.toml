[package]
name = "simcraft"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "FEA simulation app (structural, thermal, modal, thermal-stress) with a simple UI and an MCP server"
repository = "https://github.com/sushil-sundaram/simcraft"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
eframe = "0.37.0"
png = "0.18.1"
rayon = "1.12.0"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
